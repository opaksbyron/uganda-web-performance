<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uganda Web Performance Index</title>
    <meta
      name="description"
      content="Lighthouse measurements of Uganda's government, banking and university websites on a slow-3G mobile profile, with international controls."
    />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const stored = localStorage.getItem("theme")
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches
        document.documentElement.dataset.theme = stored ?? (prefersLight ? "light" : "dark")
      } catch {
        document.documentElement.dataset.theme = "dark"
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
